name: Shorts Pipeline (Telegram → YouTube)

on:
  schedule:
    # نفس أوقات لونق تقريبًا، لكن بفارق دقيقتين لتقليل احتمال تصادم
    # الـ push مع سير لونق (كلاهما يعدّل ملفات state/ في نفس اللحظة تقريبًا).
    - cron: '2 4 * * *'
    - cron: '2 9 * * *'
    - cron: '2 10 * * *'
    - cron: '2 11 * * *'
    - cron: '2 14 * * *'
    - cron: '2 17 * * *'
    - cron: '2 19 * * *'
    - cron: '2 21 * * *'
  workflow_dispatch: {}

concurrency:
  group: shorts-pipeline
  cancel-in-progress: false

jobs:
  run-shorts-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        run: pip install -q -r requirements.txt

      - name: Run shorts pipeline
        working-directory: scripts
        env:
          SHORTS_BOT_TOKEN: ${{ secrets.SHORTS_BOT_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python shorts_pipeline.py

      - name: Commit updated state (offsets + message ledger + long-smart queues)
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ || true
          if git diff --cached --quiet; then
            echo "لا تغييرات في الحالة."
            exit 0
          fi
          git commit -m "chore: update shorts bot offset / long-smart queues [skip ci]"

          # قد تكون هناك تشغيلة أخرى (لونق) عملت push في نفس الوقت بالضبط
          # (نفس جدول الـ cron)، لذلك نعيد المحاولة بدل فشل صامت يُضيّع الـ offset الجديد.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "✅ تم رفع تحديث الحالة."
              exit 0
            fi
            echo "⚠️ فشل push (محاولة $i)، جاري git pull --rebase وإعادة المحاولة..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git reset --hard HEAD~1; git merge origin/main -m "merge state"; git add state/; git commit -m "chore: update shorts bot offset / long-smart queues [skip ci]"; }
            sleep 3
          done

          echo "❌ فشل رفع تحديث الحالة بعد عدة محاولات." >&2
          exit 1
